name: Runtime network audit
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install runtime observation tools
        run: sudo apt-get update && sudo apt-get install -y strace xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1
      - run: npm ci
      - name: Test report parser
        run: node --test scripts/network-audit/report.test.mjs
      - name: Build production application
        run: npm run build
      - name: Observe Branta and verify capture control
        run: bash scripts/network-audit/run.sh
      - name: Publish destination summary
        if: always()
        run: |
          if [ -f network-audit-results/destinations.md ]; then
            cat network-audit-results/destinations.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve observation evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branta-network-audit
          path: network-audit-results/
          if-no-files-found: warn
          retention-days: 14
